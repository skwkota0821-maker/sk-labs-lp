<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK LABS マンガ Creator Studio β</title><style>:root{--panel:#0d1c39;--line:#244a81;--txt:#fff;--muted:#afc0db;--blue:#2878ff;--mag:#c82a95;--gold:#d4a62a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061022,#0b1730);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px}.top{padding:20px 0;border-bottom:1px solid #163258}.brand{font-weight:900;letter-spacing:.12em}.badge{background:#17355f;color:#d8e7ff;padding:5px 9px;border-radius:999px;font-size:12px;margin-left:8px}.hero{padding:40px 0 18px}.hero h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px}.hero p{color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(13,28,57,.96);border:1px solid var(--line);border-radius:16px;padding:20px}label{display:block;font-size:13px;color:#d8e7ff;margin:14px 0 7px}input,textarea,select{width:100%;background:#07152e;color:#fff;border:1px solid #2b5083;border-radius:10px;padding:12px;font:inherit}textarea{min-height:180px}.row,.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--blue),var(--mag));cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.alt{background:#17355f}.btn.gold{background:var(--gold);color:#111}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{font-size:13px;color:#9db4d7;margin-top:10px}.panel{background:#08172f;border:1px solid #234879;border-radius:12px;padding:14px;min-height:160px}.panel b{color:#8fbcff}.panel p{font-size:13px;line-height:1.65;color:#d5e1f2}.prompt{font-size:12px;color:#9fb3d0;background:#061022;border-radius:8px;padding:10px;white-space:pre-wrap}.generated{width:100%;margin-top:12px;border-radius:10px;display:block}.panel-actions{display:flex;gap:8px;margin-top:10px}.note{margin-top:18px;border-left:4px solid var(--gold);background:#0b1a36;padding:14px 16px;border-radius:8px;color:#dce7f7;line-height:1.7}.api-ok{color:#7ee787}.api-ng{color:#ffb86b}@media(max-width:820px){.grid,.panels,.row{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap"><span class="brand">SK LABS</span><span class="badge">Creator Studio β</span></div></div><main class="wrap"><section class="hero"><h1>物語を入れる。<br>マンガまで生成する。</h1><p>文章・体験談・アイデアから4 / 6 / 8コマの構成、セリフ、画像生成まで一つの画面で進めます。</p></section><section class="grid"><div class="card"><h2>1. 素材</h2><label>タイトル</label><input id="title" placeholder="例：雨の日に拾った猫"><label>物語・体験談・アイデア</label><textarea id="story" placeholder="自由に書いてください。"></textarea><div class="row"><div><label>形式</label><select id="format"><option value="4">4コマ</option><option value="6">6コマ</option><option value="8">8コマ</option></select></div><div><label>雰囲気</label><select id="tone"><option>あたたかい</option><option>コミカル</option><option>シリアス</option><option>青春</option><option>ビジネス</option><option>恋愛</option></select></div></div><label>主人公</label><input id="heroName" placeholder="例：コウ"><div class="actions"><button class="btn" id="generate">マンガ設計図を作る</button><button class="btn alt" id="sample">サンプル入力</button></div><div class="status" id="status">未生成</div><div class="status" id="apiStatus">画像生成APIを確認中…</div></div><div class="card"><h2>2. 出力</h2><div id="empty" class="status">左の素材から構成を生成します。</div><div id="result" hidden><h3 id="outTitle"></h3><div class="panels" id="panels"></div><div class="actions"><button class="btn gold" id="generateAll">全コマ画像生成</button><button class="btn alt" id="copy">全プロンプトをコピー</button><button class="btn alt" id="download">JSON保存</button></div></div></div></section><div class="note">β版では画像生成APIの接続状態を自動確認します。APIキーはブラウザには保存せず、Netlify Functionのサーバー側Secretからのみ利用します。公開前に加入者認証・月間クレジット制を追加します。</div></main><script>const $=s=>document.querySelector(s);let last=null,apiConfigured=false;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function checkApi(){try{const r=await fetch('/api/manga/generate');const d=await r.json();apiConfigured=!!d.configured;$('#apiStatus').className='status '+(apiConfigured?'api-ok':'api-ng');$('#apiStatus').textContent=apiConfigured?`画像生成API 接続済み（${d.model}）`:'画像生成API 未設定：Netlify Secret設定後に有効化されます';}catch{$('#apiStatus').className='status api-ng';$('#apiStatus').textContent='画像生成APIの状態を取得できません';}}function splitStory(text,n){const p=text.split(/[。！？\n]+/).map(s=>s.trim()).filter(Boolean);if(!p.length)return Array(n).fill('シーンを描写');return Array.from({length:n},(_,i)=>{const a=Math.floor(i*p.length/n),b=Math.max(a+1,Math.floor((i+1)*p.length/n));return p.slice(a,b).join('。')})}function dialogue(s,name,i,n){if(i===0)return name?`${name}「${s.slice(0,26)}…」`:`「${s.slice(0,28)}…」`;if(i===n-1)return `ナレーション「${s.slice(0,32)}」`;return `「${s.slice(0,30)}」`}function promptFor(s,tone,name,i){return `日本の商用マンガ。${tone}な雰囲気。${name?`主人公は${name}。`:''}第${i+1}コマ。場面: ${s}。人物の表情と行動が一目で分かる構図。吹き出し用の余白。画像内に文字・ロゴ・透かしを描かない。キャラクターデザインを全コマで一貫。高品質、明瞭な線、読みやすい画面構成。`}function render(){if(!last)return;$('#panels').innerHTML=last.panels.map(p=>`<div class="panel" id="panel-${p.panel}"><b>${p.panel}コマ目</b><p>${esc(p.scene)}</p><p><strong>セリフ：</strong>${esc(p.dialogue)}</p><div class="prompt">${esc(p.imagePrompt)}</div><div class="panel-actions"><button class="btn alt image-btn" data-panel="${p.panel}">このコマを画像生成</button></div><div class="image-slot">${p.image?`<img class="generated" src="${p.image}" alt="${p.panel}コマ目">`:''}</div></div>`).join('');document.querySelectorAll('.image-btn').forEach(b=>b.onclick=()=>generateImage(Number(b.dataset.panel),b));}async function generateImage(panelNo,button){if(!last)return;if(!apiConfigured){$('#status').textContent='画像生成APIが未設定です';return}const p=last.panels.find(x=>x.panel===panelNo);if(!p)return;button.disabled=true;button.textContent='生成中…';$('#status').textContent=`${panelNo}コマ目を生成中`;try{const r=await fetch('/api/manga/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p.imagePrompt,size:'1024x1024'})});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'generation_failed');p.image=d.image;render();$('#status').textContent=`${panelNo}コマ目を生成しました`;}catch(e){button.disabled=false;button.textContent='再試行';$('#status').textContent=`画像生成エラー: ${e.message}`;}}$('#generate').onclick=()=>{const story=$('#story').value.trim();if(!story){$('#status').textContent='物語を入力してください';return}const n=Number($('#format').value),tone=$('#tone').value,name=$('#heroName').value.trim(),title=$('#title').value.trim()||'無題のマンガ';const panels=splitStory(story,n).map((s,i)=>({panel:i+1,scene:s,dialogue:dialogue(s,name,i,n),imagePrompt:promptFor(s,tone,name,i),image:null}));last={title,format:n,tone,hero:name,source:story,panels,createdAt:new Date().toISOString()};$('#outTitle').textContent=`${title}｜${n}コマ`;render();$('#empty').hidden=true;$('#result').hidden=false;$('#status').textContent='設計図を生成しました'};$('#sample').onclick=()=>{$('#title').value='雨の日に拾った猫';$('#story').value='仕事帰り、雨の中で小さな猫を見つけた。最初は通り過ぎようとしたが、猫がこちらを見つめて動かなかった。傘を差し出して家まで連れて帰った。数日後、その猫は家族になり、毎朝玄関まで見送ってくれるようになった。';$('#heroName').value='コウ';$('#tone').value='あたたかい'};$('#generateAll').onclick=async()=>{if(!last||!apiConfigured){$('#status').textContent='画像生成APIが未設定です';return}for(const p of last.panels){if(p.image)continue;const b=document.querySelector(`.image-btn[data-panel="${p.panel}"]`);await generateImage(p.panel,b||{disabled:false,textContent:''});}};$('#copy').onclick=async()=>{if(!last)return;await navigator.clipboard.writeText(last.panels.map(p=>`【${p.panel}コマ目】\n${p.imagePrompt}`).join('\n\n'));$('#status').textContent='コピーしました'};$('#download').onclick=()=>{if(!last)return;const exportData={...last,panels:last.panels.map(({image,...p})=>p)};const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manga-plan.json';a.click();URL.revokeObjectURL(a.href)};checkApi();</script></body></html>
