<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK LABS マンガ Creator Studio β</title><style>
:root{--bg:#071126;--panel:#0d1c39;--line:#244a81;--txt:#fff;--muted:#afc0db;--blue:#2878ff;--mag:#c82a95;--gold:#d4a62a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061022,#0b1730);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px}.top{padding:26px 0;border-bottom:1px solid #163258}.brand{font-weight:900;letter-spacing:.12em}.badge{display:inline-block;background:#17355f;color:#d8e7ff;padding:5px 9px;border-radius:999px;font-size:12px;margin-left:8px}.hero{padding:44px 0 18px}.hero h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px}.hero p{color:var(--muted);line-height:1.8;max-width:760px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(13,28,57,.96);border:1px solid var(--line);border-radius:16px;padding:20px}.card h2{margin:0 0 14px;font-size:20px}label{display:block;font-size:13px;color:#d8e7ff;margin:14px 0 7px}input,textarea,select{width:100%;background:#07152e;color:#fff;border:1px solid #2b5083;border-radius:10px;padding:12px;font:inherit}textarea{min-height:180px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{appearance:none;border:0;border-radius:10px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--blue),var(--mag));cursor:pointer}.btn.alt{background:#17355f}.btn.gold{background:var(--gold);color:#111}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{font-size:13px;color:#9db4d7;margin-top:10px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#08172f;border:1px solid #234879;border-radius:12px;padding:14px;min-height:160px}.panel b{display:block;color:#8fbcff;margin-bottom:8px}.panel p{font-size:13px;line-height:1.65;color:#d5e1f2;margin:6px 0}.prompt{font-size:12px;color:#9fb3d0;background:#061022;border-radius:8px;padding:10px;margin-top:9px;white-space:pre-wrap}.note{margin-top:18px;border-left:4px solid var(--gold);background:#0b1a36;padding:14px 16px;border-radius:8px;color:#dce7f7;line-height:1.7}.footer{padding:34px 0;color:#8297b7;font-size:12px}@media(max-width:820px){.grid,.panels,.row{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="wrap"><span class="brand">SK LABS</span><span class="badge">Creator Studio β</span></div></div><main class="wrap"><section class="hero"><h1>物語を入れる。<br>マンガの設計図ができる。</h1><p>Creator Studio βは、文章・体験談・セリフから4コマ/短編マンガの構成、セリフ、各コマの画像生成用プロンプトを自動で組み立てるMVPです。</p></section><section class="grid"><div class="card"><h2>1. 素材を入れる</h2><label>タイトル</label><input id="title" placeholder="例：雨の日に拾った猫"><label>物語・体験談・アイデア</label><textarea id="story" placeholder="自由に書いてください。長文でもOKです。"></textarea><div class="row"><div><label>形式</label><select id="format"><option value="4">4コマ</option><option value="6">6コマ</option><option value="8">8コマ</option></select></div><div><label>雰囲気</label><select id="tone"><option>あたたかい</option><option>コミカル</option><option>シリアス</option><option>青春</option><option>ビジネス</option><option>恋愛</option></select></div></div><label>主人公</label><input id="heroName" placeholder="例：コウ"><div class="actions"><button class="btn" id="generate">マンガ設計図を作る</button><button class="btn alt" id="sample">サンプル入力</button></div><div class="status" id="status">未生成</div></div><div class="card"><h2>2. 出力</h2><div id="empty" class="status">左の素材から構成を生成します。</div><div id="result" hidden><h3 id="outTitle"></h3><div class="panels" id="panels"></div><div class="actions"><button class="btn gold" id="copy">全プロンプトをコピー</button><button class="btn alt" id="download">JSON保存</button></div></div></div></section><div class="note">このβ版は「脚本・コマ割り・画像生成プロンプト」までを自動化します。次段階で、Stripe加入者判定・月間クレジット・画像生成API・キャラクター固定・PDF/画像書き出しを接続します。</div></main><footer class="wrap footer">SK LABS マンガ Creator Studio β</footer><script>
const $=s=>document.querySelector(s);let last=null;function splitStory(text,n){const parts=text.split(/[。！？\n]+/).map(s=>s.trim()).filter(Boolean);if(!parts.length)return Array(n).fill('シーンを描写');const out=[];for(let i=0;i<n;i++){const start=Math.floor(i*parts.length/n),end=Math.max(start+1,Math.floor((i+1)*parts.length/n));out.push(parts.slice(start,end).join('。'));}return out}
function dialogue(scene,name,i,n){if(i===0)return name?`${name}「${scene.slice(0,26)}…」`:`「${scene.slice(0,28)}…」`;if(i===n-1)return `ナレーション「${scene.slice(0,32)}」`;return `「${scene.slice(0,30)}」`}
function promptFor(scene,tone,name,i){return `日本の商用マンガ。${tone}な雰囲気。${name?`主人公は${name}。`:''}第${i+1}コマ。場面: ${scene}。人物の表情と行動が一目で分かる構図。吹き出しを置ける余白を確保。キャラクターデザインを全コマで一貫させる。高品質、明瞭な線、読みやすい画面構成。`}
$('#generate').onclick=()=>{const story=$('#story').value.trim();if(!story){$('#status').textContent='物語を入力してください';return}const n=Number($('#format').value),tone=$('#tone').value,name=$('#heroName').value.trim(),title=$('#title').value.trim()||'無題のマンガ';const scenes=splitStory(story,n).map((s,i)=>({panel:i+1,scene:s,dialogue:dialogue(s,name,i,n),imagePrompt:promptFor(s,tone,name,i)}));last={title,format:n,tone,hero:name,source:story,panels:scenes,createdAt:new Date().toISOString()};$('#outTitle').textContent=`${title}｜${n}コマ`;$('#panels').innerHTML=scenes.map(p=>`<div class="panel"><b>${p.panel}コマ目</b><p>${p.scene}</p><p><strong>セリフ：</strong>${p.dialogue}</p><div class="prompt">${p.imagePrompt}</div></div>`).join('');$('#empty').hidden=true;$('#result').hidden=false;$('#status').textContent='生成済み'};
$('#sample').onclick=()=>{$('#title').value='雨の日に拾った猫';$('#story').value='仕事帰り、雨の中で小さな猫を見つけた。最初は通り過ぎようとしたが、猫がこちらを見つめて動かなかった。傘を差し出して家まで連れて帰った。数日後、その猫はすっかり家族になり、毎朝玄関まで見送ってくれるようになった。';$('#heroName').value='コウ';$('#tone').value='あたたかい'};
$('#copy').onclick=async()=>{if(!last)return;await navigator.clipboard.writeText(last.panels.map(p=>`【${p.panel}コマ目】\n${p.imagePrompt}`).join('\n\n'));$('#status').textContent='画像生成プロンプトをコピーしました'};
$('#download').onclick=()=>{if(!last)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manga-plan.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
