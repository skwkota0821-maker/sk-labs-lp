name: Seedance Adapter Check

on:
  pull_request:
    paths:
      - "docs/seedance-2-5-adapter-spec.md"
      - "tools/seedance_probe.py"
      - "tests/test_seedance_probe.py"
      - "examples/seedance-reference-pack.example.json"
      - ".github/workflows/seedance-adapter-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 権利ゲート単体テスト
        run: python -m unittest tests/test_seedance_probe.py -v
      - name: 参照パックdry-run検証
        run: python tools/seedance_probe.py --reference-pack examples/seedance-reference-pack.example.json
      - name: LAS_API_KEY設定状態確認
        env:
          LAS_API_KEY: ${{ secrets.LAS_API_KEY }}
        shell: bash
        run: |
          if [ -n "$LAS_API_KEY" ]; then
            echo "LAS_API_KEY_CONFIGURED=true"
          else
            echo "LAS_API_KEY_CONFIGURED=false"
          fi
