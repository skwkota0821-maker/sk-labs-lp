[build]
  publish = "public"
  command = "npm run build"

[[redirects]]
  from = "/starter-kit"
  to = "/starter-kit.html"
  status = 200

# 末尾スラッシュ付き（/starter-kit/）も同じ無料資料ページへ（2026年9月30日）
[[redirects]]
  from = "/starter-kit/"
  to = "/starter-kit"
  status = 301

# 「/ → index-v2.html」の規則は index.html と同じパスのため適用されず（シャドーイング）、本番は index.html を配信していた。
# 実際の配信（index.html）に合わせて明示的に削除（2026年9月30日）。index-v2.html 自体は保全する。

# 存在しないURLは旧v2ページを200で返さず、404ページを返す（2026年9月30日）
[[redirects]]
  from = "/member"
  to = "/member.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"
