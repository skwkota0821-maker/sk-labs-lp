[build]
  publish = "public"

[[redirects]]
  from = "/starter-kit"
  to = "/starter-kit.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index-v2.html"
  status = 200

# 存在しないURLは旧v2ページを200で返さず、404ページを返す（2026年9月30日）
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"
